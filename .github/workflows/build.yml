name: build

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: |
          go test ./...
          go vet ./...
      - name: Build ARMv7 twice
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/tattler-armv7-a ./cmd/tattler
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/tattler-armv7-b ./cmd/tattler
          cmp dist/tattler-armv7-a dist/tattler-armv7-b
          mv dist/tattler-armv7-a dist/tattler-linux-armv7
          rm dist/tattler-armv7-b
      - name: Build and verify SPK twice
        run: |
          python3 tools/build_spk.py --binary dist/tattler-linux-armv7 --output dist/Tattler-a.spk
          python3 tools/build_spk.py --binary dist/tattler-linux-armv7 --output dist/Tattler-b.spk
          python3 tools/verify_spk.py dist/Tattler-a.spk
          python3 tools/verify_spk.py dist/Tattler-b.spk
          cmp dist/Tattler-a.spk dist/Tattler-b.spk
          mv dist/Tattler-a.spk dist/Tattler-armada38x-0.1.0-0001.spk
          rm dist/Tattler-b.spk
      - uses: actions/upload-artifact@v4
        with:
          name: tattler-armada38x-spk
          path: dist/Tattler-armada38x-0.1.0-0001.spk
